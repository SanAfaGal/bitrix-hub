# Se carga automáticamente junto a docker-compose.yml con `docker compose up`
# (no hace falta -f). Solo para desarrollo local: monta el código para
# recargar en caliente sin rebuild. En producción no se usa este archivo
# (se corre con `docker compose -f docker-compose.yml up`, o simplemente no
# se lleva este archivo al servidor).

services:
  api:
    volumes:
      - ./app:/app/app
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
