# Se carga automáticamente junto a docker-compose.yml con `docker compose up`
# (no hace falta -f). Solo para desarrollo local: monta el código para
# recargar en caliente sin rebuild, y trae mysql + adminer para tener el
# panel de plantillas funcional en local sin depender de un MySQL externo.
# En producción no se usa este archivo (se corre con
# `docker compose -f docker-compose.yml up`, o simplemente no se lleva este
# archivo al servidor) — ahí MySQL se resuelve aparte (gestionado o externo),
# apuntado vía las variables MYSQL_* del .env.

services:
  api:
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    container_name: bitrix-hub-mysql
    restart: unless-stopped

    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bitrix_hub}
      MYSQL_USER: ${MYSQL_USER:-bitrix_hub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - ./.mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  adminer:
    image: adminer:latest
    container_name: bitrix-hub-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
