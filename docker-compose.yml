networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-bitrix-hub}
    external: ${DOCKER_NETWORK_EXTERNAL:-false}

services:
  api:
    build: .
    container_name: bitrix-hub-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      waha:
        condition: service_healthy
      whisper:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-1}"
          memory: "${API_MEMORY_LIMIT:-512M}"

  waha:
    # Sin versión semántica publicada upstream (su propio label
    # org.opencontainers.image.version dice "latest") — se fija por digest
    # para que un `docker compose pull` no traiga un cambio breaking sin
    # que nadie lo pida. Actualizar deliberadamente: `docker pull
    # devlikeapro/waha:latest && docker inspect devlikeapro/waha:latest
    # --format='{{index .RepoDigests 0}}'`.
    image: devlikeapro/waha:latest@sha256:d52ad4f394d2e48eb92d58e0f04924ff6c7621a883d08ff64176479ecd77c9ca
    container_name: waha
    restart: unless-stopped

    # Solo accesible desde el propio servidor.
    # Nginx/Caddy/Traefik será quien exponga HTTPS si hace falta acceso externo.
    ports:
      - "127.0.0.1:${WAHA_PORT:-3000}:3000"

    dns:
      - 1.1.1.1
      - 8.8.8.8

    env_file:
      - .env

    volumes:
      # Sesiones de WhatsApp
      - ./.waha-data/sessions:/app/.sessions

      # Archivos multimedia
      - ./.waha-data/media:/app/.media

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --header=\"X-Api-Key: $$WAHA_API_KEY\" --spider http://127.0.0.1:3000/api/version || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "${WAHA_CPU_LIMIT:-2}"
          memory: "${WAHA_MEMORY_LIMIT:-2G}"

  whisper:
    # Mismo motivo que `waha` arriba: fijado por digest, no por tag `latest`.
    # Actualizar deliberadamente: `docker pull
    # onerahmet/openai-whisper-asr-webservice:latest && docker inspect
    # onerahmet/openai-whisper-asr-webservice:latest --format='{{index .RepoDigests 0}}'`.
    image: onerahmet/openai-whisper-asr-webservice:latest@sha256:0616c3d5fc6924e9d59aa8a7a3a944fbe8f3a5d701e5fc1fa2ce5b933dfecb73
    container_name: whisper
    restart: unless-stopped

    # Sin puerto publicado — solo el servicio `api` lo alcanza, por hostname
    # `whisper` (misma red default de compose que usa `waha`).
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-base}
      ASR_MODEL_PATH: /app/.cache/models

    volumes:
      # Modelo descargado — se conserva entre restarts.
      - ./.whisper-data/models:/app/.cache/models

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "${WHISPER_CPU_LIMIT:-2}"
          memory: "${WHISPER_MEMORY_LIMIT:-2G}"
