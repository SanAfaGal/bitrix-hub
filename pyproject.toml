[project]
name = "bitrix-hub"
version = "0.1.0"
description = "Hub de integraciones disparadas por webhooks de Bitrix (Waha, y a futuro Mobilia, etc.)"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "openai>=3.3.1",
    "opencv-python-headless>=5.0.0.93",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "tzdata>=2026.3",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
